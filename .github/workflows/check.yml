name: Periksa konsistensi

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # token = CSS, fondasi = token, panduan = kode, skill = sumber
      - run: npm run check
      - run: npm run typecheck
      - run: npx vite build
      # tes perilaku, aksesibilitas (axe), dan ukuran komponen terhadap galeri situs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
