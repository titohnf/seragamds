name: Periksa konsistensi

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # token = CSS, fondasi = token, panduan = kode, skill = sumber
      - run: npm run check
      - run: npm run typecheck
      - run: npx vite build
